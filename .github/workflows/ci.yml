name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Build library
        run: make

      - name: Run tests
        run: make -C example test
